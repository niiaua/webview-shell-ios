name: WebViewShell
options:
  bundleIdPrefix: com.ourlamp
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # 让 xcodegen 自动链接系统 framework（WebKit/UIKit 等被 @import 使用）
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # 无签名构建：CI 上没证书，第三方签名工具会重签
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_ENTITLEMENTS: ""

targets:
  WebViewShell:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Info.plist"
    dependencies:
      - sdk: WebKit.framework
      - sdk: UIKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ourlamp.cc
        PRODUCT_NAME: WebViewShell
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/WebViewShell-Bridging-Header.h
